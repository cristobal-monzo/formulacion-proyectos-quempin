<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QUEMPIN — Formulación de Proyectos</title>
  <meta name="description" content="Herramienta de formulación y evaluación de costos de proyectos de QUEMPIN Soluciones Energéticas.">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/icono-180.png">
  <!-- Sistema de marca compartido con la Calculadora Técnica y los Tableros Financieros -->
  <link rel="stylesheet" href="css/brand.css">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Aplica el tema guardado antes de pintar (evita parpadeo). 'qpn.tema' era la clave de la versión anterior.
    try {
      var t = localStorage.getItem('quempin_fp_theme') || localStorage.getItem('qpn.tema');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
<div class="viz-root" id="root">
  <header class="viz-header">
    <div class="viz-container">
      <a class="viz-logo" href="#/" aria-label="Inicio: proyectos formulados"><span class="viz-wordmark">QUEMP<span class="in">IN</span></span></a>
      <div class="viz-titleblock">
        <h1>Formulación de Proyectos</h1>
        <p id="hdr-sub">Costos, precio y evaluación de ofertas por partida</p>
      </div>
      <button class="viz-theme-toggle cuenta-btn" type="button" id="cuentaBtn" data-menu="cuenta" aria-haspopup="menu" aria-expanded="false" hidden></button>
      <button class="viz-theme-toggle hb" type="button" data-act="config" aria-label="Configuración"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="hb-t">Configuración</span></button>
      <button class="viz-theme-toggle hb" type="button" id="themeToggle" data-act="tema">Modo oscuro</button>
    </div>
    <nav class="viz-modnav" aria-label="Secciones de la herramienta">
      <div class="viz-container viz-modnav-inner" id="modnav"></div>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="viz-container viz-footer">
    Herramienta interna de <strong>QUEMPIN Soluciones Energéticas</strong> · <span id="footer-datos">Los proyectos se guardan en este navegador: respáldalos con «Exportar Excel».</span> ·
    <a href="https://www.quempin.cl" target="_blank" rel="noopener">www.quempin.cl</a>
  </footer>

  <!-- Capas flotantes: dentro de .viz-root para heredar los colores del tema -->
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="tooltip" class="viz-tooltip" role="tooltip"></div>
  <div id="pop" class="pop" hidden></div>
  <dialog id="modal"></dialog>
  <input type="file" id="file-import" accept=".json,.xlsx,.xlsm" hidden>
</div>

<noscript><p style="padding:24px;font-family:sans-serif">Esta herramienta necesita JavaScript habilitado.</p></noscript>

<script src="js/logo-data.js"></script>
<script src="js/kpis.js"></script>
<script src="js/calc.js"></script>
<script src="js/store.js"></script>
<!-- SharePoint: el ingreso con Microsoft usa MSAL 5.23.0 (copia local en vendor/msal, licencia MIT),
     que cloud.js carga solo si la conexión está configurada -->
<script src="js/m365-config.js"></script>
<script src="js/cloud.js"></script>
<script src="js/excel.js"></script>
<script src="js/app.js"></script>
</body>
</html>
